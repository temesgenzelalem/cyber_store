name: cyber_store
description: Cyber – Mobile E-Commerce App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # ── State Management ──────────────────────────────────────────────────────
  provider: ^6.1.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^12.1.3

  # ── UI ────────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  fl_chart: ^0.66.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2
  lottie: ^3.1.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  http: ^1.1.0
  url_launcher: ^6.2.5
  ar_flutter_plugin: ^0.7.3
  speech_to_text: ^6.6.2
  google_maps_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
